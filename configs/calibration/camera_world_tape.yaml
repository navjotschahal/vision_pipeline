# Camera pose in CPF's world frame from a tape measure + the D435I accelerometer.
# Read by: python -m vision_pipeline.apps.cpf_box_handoff
#
# WORLD FRAME = openarm_body_link0 (CPF / MuJoCo world):
#   x forward (from the robot toward the table), y to the ROBOT'S LEFT, z up.
#   Origin: bottom of the robot base, directly under the centre of the 60 x 60 mm
#   vertical column. The shoulder mounts are at z = 0.698 m.
#
# Measure in metres along those world axes. Roll and pitch come from the IMU at start-up,
# so only position and heading are taped. Replace every value, then set measured: true.
measured: false
measured_on: "YYYY-MM-DD"
world_frame: openarm_body_link0
camera_frame: realsense_color_optical

# A point you can put the tape on, with known world coordinates. With the robot standing
# on the table, the world origin IS a tape point: the table surface directly under the
# centre of the black 60 x 60 mm column (30 mm behind the column's front face, centred
# left-right). Then heights above the table top are world z.
reference_point_world_metres: [0.0, 0.0, 0.0]

# From that reference point to the centre of the camera's RGB lens (find it by covering
# lenses one at a time while the colour view is shown). Forward +x (from the robot toward
# the camera if the camera faces the robot), robot-left +y (stand behind the robot facing
# the same way it does; your left is +y -- that is the RIGHT side of the camera image when
# the camera faces the robot), up +z.
camera_offset_from_reference_metres: [0.0, 0.0, 0.0]

# Heading: give ONE of these.
# Preferred: run `cpf_box_handoff --measure`, put a coin on the table under the crosshair,
# and tape the coin's world position (z = 0 on the table top).
aim_point_world_metres: [0.0, 0.0, 0.0]
# Or the optical-axis direction projected on the floor, degrees from world +x toward +y
# (a camera in front of the robot looking straight back at it is 180).
# heading_deg: 180.0

notes: ""
