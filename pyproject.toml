[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-pipeline"
version = "0.1.0"
description = "Reusable measurement-to-world-belief infrastructure for robotics experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
webcam = [
    "numpy>=1.26,<2.5",
    "opencv-python>=4.10,<5",
]
yolo = [
    "ultralytics>=8.4,<9",
]
dino = [
    "numpy>=1.26,<2.5",
    "opencv-python>=4.10,<5",
    "torch>=2.1,<3",
]
fusion = [
    "numpy>=1.26,<2.5",
]
iphone = [
    "numpy>=1.26,<2.5",
    "opencv-python>=4.10,<5",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
vision-pipeline = "vision_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_pipeline = ["native/*.swift"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
